<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoRTK Admin</title>

    <!-- External Libs -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/fontawesome/all.min.css">
    <link rel="stylesheet" href="/static/leaflet/leaflet.css" />

    <!-- Custom Theme -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-uppercase small" style="letter-spacing: 2px;">System Initializing</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-satellite-dish me-2"></i>NANO<span style="color: var(--ub-red)">RTK</span>
            </a>

            <div class="d-flex align-items-center text-light small text-uppercase" style="letter-spacing: 1px;">
                <span class="me-2 text-muted">Link Status:</span>
                <span id="socketStatus" class="d-flex align-items-center">
                    <span class="socket-status socket-disconnected me-1"></span>
                    <span id="socketStatusText">Disconnected</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="d-flex align-items-center">
                <h6 class="mb-0 text-uppercase me-3 text-muted">System State</h6>
                <span id="serviceStatusBadge" class="badge bg-secondary">CHECKING</span>
            </div>

            <div class="btn-group">
                <button id="btnStart" class="btn btn-success">
                    <i class="fas fa-play me-2"></i> Start
                </button>
                <button id="btnStop" class="btn btn-danger">
                    <i class="fas fa-stop me-2"></i> Stop
                </button>
            </div>
        </div>

        <div class="row align-items-stretch">
            <!-- Configuration Panel -->
            <div class="col-lg-5 col-xl-4">
                <div class="card config-panel mb-0">
                    <div class="card-header">
                        <span><i class="fas fa-sliders-h me-2"></i> Configuration</span>
                        <span class="badge bg-dark text-muted">V2.0</span>
                    </div>
                    <div class="card-body">
                        <form id="configForm">
                            <!-- Serial Section -->
                            <h6 class="text-uppercase text-muted small border-bottom pb-1 mb-3">Serial Interface</h6>
                            <div class="row g-2 mb-3">
                                <div class="col-12 col-md-8">
                                    <label class="form-label">Port</label>
                                    <div class="input-group">
                                        <select class="form-select" name="serial.port" id="serialPortSelect" required>
                                            <option value="">Scanning...</option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" id="btnRefreshPorts"
                                            title="Refresh">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label class="form-label">Baudrate</label>
                                    <input type="number" class="form-control" name="serial.baudrate" id="serialBaudrate"
                                        required>
                                </div>
                            </div>

                            <!-- NTRIP Section -->
                            <h6 class="text-uppercase text-muted small border-bottom pb-1 mb-3 pt-2">NTRIP Caster</h6>
                            <div class="row g-2 mb-2">
                                <div class="col-md-8 pl-1">
                                    <label class="form-label">Host</label>
                                    <input type="text" class="form-control" name="ntrip.host" id="ntripHost" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Port</label>
                                    <input type="number" class="form-control" name="ntrip.port" id="ntripPort" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Mountpoint</label>
                                <input type="text" class="form-control" name="ntrip.mountpoint" id="ntripMountpoint"
                                    required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" name="ntrip.username" id="ntripUsername"
                                        required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" name="ntrip.password" id="ntripPassword"
                                        required>
                                </div>
                            </div>

                            <!-- Base Station -->
                            <h6 class="text-uppercase text-muted small border-bottom pb-1 mb-3 pt-2">Base Coordinates
                            </h6>
                            <div class="row g-2 mb-2">
                                <div class="col-4">
                                    <label class="form-label">Lat</label>
                                    <input type="number" step="any" class="form-control" name="base_station.latitude"
                                        id="baseStationLatitude" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label">Lon</label>
                                    <input type="number" step="any" class="form-control" name="base_station.longitude"
                                        id="baseStationLongitude" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label">Alt</label>
                                    <input type="number" step="any" class="form-control" name="base_station.altitude"
                                        id="baseStationAltitude" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div id="map" style="height: 200px; width: 100%;"></div>
                                <small class="text-muted d-block mt-1"><i class="fas fa-info-circle"></i> Click map to
                                    set coordinates</small>
                            </div>

                            <!-- Advanced -->
                            <div class="mb-4">
                                <label class="form-label">ARP Average Mode (1=On, 0=Off)</label>
                                <input type="number" min="0" max="1" class="form-control"
                                    name="base_station.enable_arp_average" id="baseStationArpAverage" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save me-2"></i> Save Configuration
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Monitoring Panel -->
            <div class="col-lg-7 col-xl-8 d-flex flex-column monitoring-col">
                <!-- System Stats -->
                <div class="card mb-3 monitoring-panel">
                    <div class="card-header">
                        <span><i class="fas fa-chart-pie me-2"></i> System Monitoring</span>
                        <div class="d-none d-md-block text-muted small" id="uptimeText">--</div>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted small text-uppercase">CPU Temp</span>
                                    <span class="small" id="cpuTempText">--</span>
                                </div>
                                <div class="progress">
                                    <div id="cpuTempProgress" class="progress-bar" role="progressbar" style="width: 0%">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted small text-uppercase">Memory Usage</span>
                                    <span class="small" id="memoryText">--</span>
                                </div>
                                <div class="progress">
                                    <div id="memoryProgress" class="progress-bar" role="progressbar" style="width: 0%">
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 border-top border-secondary mt-3 pt-2">
                                <div class="row small text-muted">
                                    <div class="col-6">HW: <span id="hardwareText" class="text-light">--</span></div>
                                    <div class="col-6 text-end">OS: <span id="systemText" class="text-light">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Logs -->
                <div class="card logs-panel mb-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header">
                        <span><i class="fas fa-terminal me-2"></i> System Logs</span>
                        <button id="btnClearLogs" class="btn btn-sm btn-outline-secondary py-0">Clear</button>
                    </div>
                    <div class="card-body p-0 d-flex flex-column flex-grow-1">
                        <div id="logTerminal" class="log-terminal flex-grow-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-4 mb-3 text-center text-muted small text-uppercase">
            <p>&copy; <span id="currentYear"></span> NanoRTK Admin | <i class="fas fa-code-branch"></i> v2.0</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/leaflet/leaflet.js"></script>
    <script src="/static/js/socket.io.min.js"></script>

    <!-- Application Logic -->
    <script src="/static/js/app.js"></script>
</body>

</html>
